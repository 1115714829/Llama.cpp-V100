name: CI (cann)

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - master
    paths: [
      '.github/workflows/build-cann.yml',
      '**/CMakeLists.txt',
      '**/.cmake',
      '**/*.h',
      '**/*.hpp',
      '**/*.c',
      '**/*.cpp'
    ]

  pull_request:
    types: [opened, synchronize, reopened]
    paths: [
      '.github/workflows/build-cann.yml',
      'ggml/src/ggml-cann/**'
    ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  # The real CANN build is disabled: it needs dedicated runners that are not
  # provisioned (upstream TODO, ggml-org/llama.cpp#23705). A workflow whose jobs
  # are all commented out reports a failed run, which turned every push in this
  # fork red for a build that is intentionally off, so this placeholder keeps the
  # check green until the runners exist. Re-enable by restoring the
  # openEuler-latest-cann job in place of this one.
  cann-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: CANN build is disabled
        run: |
          echo "CANN build disabled - dedicated runners are not provisioned (upstream PR ggml-org/llama.cpp#23705)."
